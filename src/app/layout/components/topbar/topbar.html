<header class="topbar">
  <div>
    <h1>Dental CDSS</h1>
    <p>Welcome to your clinical management workspace</p>
  </div>

  <div class="topbar-actions">
    <h1>
      <div class="user-chip">
        <i class="pi pi-user"></i>
        <span>{{ user?.['username'] || 'User' }}</span>
      </div>
    </h1>

    <p-button
      label="Logout"
      icon="pi pi-sign-out"
      severity="contrast"
      outlined="true"
      (onClick)="logout()"
    />
    <p-button
      [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      severity="secondary"
      [rounded]="true"
      [text]="true"
      (onClick)="toggleTheme()"
    />
  </div>
</header>
