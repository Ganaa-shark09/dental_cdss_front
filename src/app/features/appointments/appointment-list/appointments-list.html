<p-card styleClass="p-card-page">
  <ng-template #header>
    <h1 class="cdss-page-card-title">Appointments</h1>
  </ng-template>

  <p-card styleClass="p-card-section">
    <ng-template #header>
      <div class="cdss-section-card-header">
        <div class="cdss-section-card-title-section">
          <h2 class="cdss-section-card-title">Manage Appointments</h2>
        </div>

        <div class="cdss-section-card-buttons">
          <app-cdss-new-button
            label="New Appointment"
            (click)="createAppointment()"
          ></app-cdss-new-button>
        </div>
      </div>
    </ng-template>

    <p-card styleClass="p-card-section-panel">
      <app-cdss-table
        [data]="appointments()"
        [config]="tableConfig()"
        [loading]="loading()"
        [totalRecords]="totalRecords()"
        (view)="onViewAppointment($event)"
        (edit)="onEditAppointment($event)"
        (lazyLoad)="onLazyLoad($event)"
      >
      </app-cdss-table>
    </p-card>
  </p-card>
</p-card>

<p-confirmDialog></p-confirmDialog>
