<p-card styleClass="p-card-page">
  <ng-template #header>
    <h1 class="cdss-page-card-title">
      {{ isEditMode ? 'Edit Report' : 'New Report' }}
    </h1>
  </ng-template>

  <app-cdss-form
    [config]="config()"
    [loading]="
      loading() ||
      saving() ||
      consultationsLoading() ||
      prescriptionsLoading() ||
      treatmentPlansLoading() ||
      documentsLoading()
    "
    [disableOnInvalid]="false"
    (submit)="save($event.rawValue)"
    (back)="onBack()"
  ></app-cdss-form>
</p-card>
