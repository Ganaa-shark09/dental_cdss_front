<p-card styleClass="p-card-page">
  <ng-template #header>
    <h1 class="cdss-page-card-title">
      {{ isEditMode ? 'Edit Document' : 'New Document' }}
    </h1>
  </ng-template>

  <app-cdss-form
    [config]="config()"
    [loading]="
      loading() || saving() || patientsLoading() || consultationsLoading() || clinicsLoading()
    "
    [disableOnInvalid]="true"
    (submit)="save($event.rawValue)"
    (back)="onBack()"
  ></app-cdss-form>
</p-card>
