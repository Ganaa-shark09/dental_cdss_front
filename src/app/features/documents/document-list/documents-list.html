<p-card styleClass="p-card-page">
  <!-- <ng-template #header>
    <h1 class="cdss-page-card-title">Documents</h1>
  </ng-template> -->

  <p-card styleClass="p-card-section">
    <ng-template #header>
      <div class="cdss-section-card-header">
        <div class="cdss-section-card-title-section">
          <h2 class="cdss-section-card-title">Manage Documents</h2>
        </div>

        <div class="cdss-section-card-buttons">
          <app-cdss-new-button
            label="New Document"
            (click)="createDocument()"
          ></app-cdss-new-button>
        </div>
      </div>
    </ng-template>

    <p-card styleClass="p-card-section-panel">
      <app-cdss-table
        [data]="data()"
        [config]="config()"
        [loading]="loading()"
        [totalRecords]="totalRecords()"
        (view)="onViewDocument($event)"
        (edit)="onEditDocument($event)"
        (lazyLoad)="onLazyLoad($event)"
      >
        <ng-template #actions let-item>
          <app-cdss-delete-button (click)="deleteDocument(item)"></app-cdss-delete-button>
        </ng-template>
      </app-cdss-table>
    </p-card>
  </p-card>
</p-card>

<p-confirmDialog></p-confirmDialog>
