<p-card styleClass="p-card-page">
  <ng-template #header>
    <h1 class="cdss-page-card-title">
      {{ isEditMode ? 'Edit Patient' : 'New Patient' }}
    </h1>
  </ng-template>

  <app-cdss-form
    [config]="formConfig()"
    [loading]="loading() || saving()"
    [disableOnInvalid]="true"
    (submit)="onSave($event.rawValue)"
    (back)="onBack()"
  ></app-cdss-form>
</p-card>
