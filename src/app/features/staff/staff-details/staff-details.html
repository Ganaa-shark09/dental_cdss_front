<p-card styleClass="p-card-page">
  <ng-template #header>
    <div class="cdss-section-card-header">
      <div class="cdss-section-card-title-section">
        <h1 class="cdss-page-card-title">Staff Details</h1>
      </div>

      <div class="cdss-section-card-buttons">
        <app-cdss-back-button (click)="onBack()"></app-cdss-back-button>
        <app-cdss-save-button
          label="Edit"
          severity="secondary"
          (click)="onEdit()"
        ></app-cdss-save-button>
      </div>
    </div>
  </ng-template>

  <app-cdss-details
    [title]="(member()?.user_name || '')"
    [subtitle]="member()?.user_email || ''"
    [rows]="detailRows()"
  ></app-cdss-details>
</p-card>
