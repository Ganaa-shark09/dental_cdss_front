<p-card styleClass="p-card-page">
  <!-- <ng-template #header>
    <h1 class="cdss-page-card-title">Odontology</h1>
  </ng-template> -->

  <p-card styleClass="p-card-section">
    <ng-template #header>
      <div class="cdss-section-card-header">
        <div class="cdss-section-card-title-section">
          <h2 class="cdss-section-card-title">Dental Charts</h2>
        </div>

        <div class="cdss-section-card-buttons">
          <app-cdss-new-button label="New Chart" (click)="onCreate()"></app-cdss-new-button>
        </div>
      </div>
    </ng-template>

    <p-card styleClass="p-card-section-panel">
      <app-cdss-table
        [data]="data()"
        [config]="config()"
        [loading]="loading()"
        [totalRecords]="data().length"
        (view)="onView($event)"
        (edit)="onEdit($event)"
      ></app-cdss-table>
    </p-card>
  </p-card>
</p-card>
