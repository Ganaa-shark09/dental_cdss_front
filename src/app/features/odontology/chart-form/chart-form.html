<p-card styleClass="p-card-page">
  <ng-template #header>
    <h1 class="cdss-page-card-title">
      {{ isEditMode ? 'Edit Dental Chart' : 'New Dental Chart' }}
    </h1>
  </ng-template>

  <app-cdss-form
    [config]="config()"
    [loading]="loading() || saving() || consultationsLoading()"
    [disableOnInvalid]="false"
    (submit)="save($event.rawValue)"
    (back)="onBack()"
  ></app-cdss-form>
</p-card>
